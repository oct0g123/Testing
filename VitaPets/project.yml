name: VitaPets
options:
  bundleIdPrefix: com.vitapets
  deploymentTarget:
    iOS: "17.0"
    visionOS: "1.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: VitaPets
    INFOPLIST_KEY_NSHumanReadableDescription: "Your tiny pocket companion"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  VitaPets:
    type: application
    platform: [iOS, visionOS]
    sources:
      - path: VitaPets
        excludes:
          - "**/*.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitapets.app
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad for iOS
    scheme:
      testTargets:
        - VitaPetsTests
      gatherCoverageData: false

  VitaPetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VitaPetsTests
        createIntermediateGroups: true
    dependencies:
      - target: VitaPets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitapets.tests
