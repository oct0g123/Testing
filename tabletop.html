<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fableboard — Virtual Tabletop</title>
<style>
:root{
  --wood-dark:#241a12; --wood:#3a2a1b; --wood-light:#4d3a26;
  --parch:#efe3c4; --parch-dark:#e2d1a8; --ink:#2b2014;
  --gold:#c9a227; --gold-bright:#e8c454; --red:#a5372c; --green:#4e7a3a;
  --blue:#3b6b8a; --text:#e8dcc0; --text-dim:#a99c7e;
  --panel:#2e2216; --panel-edge:#5a4630;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden;}
body{
  font-family:Georgia,'Times New Roman',serif; background:var(--wood-dark); color:var(--text);
  display:flex; flex-direction:column;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- Top bar ---------- */
#topbar{
  display:flex; align-items:center; gap:10px; padding:6px 14px;
  background:linear-gradient(#43301d,#2c1f12); border-bottom:2px solid var(--panel-edge);
  flex-shrink:0; user-select:none;
}
#logo{font-size:19px; font-weight:bold; color:var(--gold-bright); letter-spacing:1px; text-shadow:0 2px 3px #000;}
#logo small{color:var(--text-dim); font-size:11px; letter-spacing:0; margin-left:6px; font-style:italic;}
.mode-tabs{display:flex; gap:4px; margin-left:18px;}
.mode-tab{
  padding:5px 14px; border-radius:6px 6px 0 0; border:1px solid var(--panel-edge); border-bottom:none;
  background:#241a10; color:var(--text-dim); font-size:13px;
}
.mode-tab.active{background:var(--parch); color:var(--ink); font-weight:bold;}
#topbar .spacer{flex:1;}
.tb-btn{
  background:var(--wood-light); border:1px solid var(--panel-edge); color:var(--text);
  border-radius:6px; padding:5px 11px; font-size:13px;
}
.tb-btn:hover{background:#5f4930; border-color:var(--gold);}

/* ---------- Layout ---------- */
#main{flex:1; display:flex; min-height:0;}
#boardwrap{flex:1; position:relative; background:#191510; min-width:0;}
#board{position:absolute; inset:0; width:100%; height:100%; cursor:grab;}
#board.painting{cursor:crosshair;}
#board.targeting{cursor:crosshair;}

#board-tools{
  position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:6px; z-index:5;
}
.bt-btn{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--panel-edge);
  background:rgba(46,34,22,.92); color:var(--text); font-size:16px; line-height:1;
}
.bt-btn:hover{border-color:var(--gold);}
.bt-btn.on{background:var(--gold); color:var(--ink);}

#hoverinfo{
  position:absolute; bottom:10px; left:10px; z-index:5; font-size:12px; color:var(--text-dim);
  background:rgba(20,15,10,.85); padding:4px 10px; border-radius:6px; pointer-events:none;
  border:1px solid #443626; font-family:Verdana,sans-serif;
}
#turn-banner{
  position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:6; pointer-events:none;
  background:rgba(30,22,13,.95); border:1px solid var(--gold); border-radius:8px;
  padding:6px 18px; font-size:14px; color:var(--gold-bright); text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.5);
}
#turn-banner .tb-sub{font-size:11px; color:var(--text-dim); font-family:Verdana,sans-serif; margin-top:2px;}
.hidden{display:none !important;}

/* ---------- Editor palette ---------- */
#editor-palette{
  position:absolute; top:10px; right:10px; z-index:6; width:230px;
  background:rgba(38,28,18,.96); border:1px solid var(--panel-edge); border-radius:10px;
  padding:12px; font-family:Verdana,sans-serif; font-size:12px;
  max-height:calc(100% - 20px); overflow-y:auto;
}
#editor-palette h3{font-family:Georgia,serif; color:var(--gold-bright); font-size:14px; margin-bottom:8px;}
#editor-palette h4{color:var(--text-dim); font-size:11px; margin:10px 0 5px; text-transform:uppercase; letter-spacing:.5px;}
.terrain-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:5px;}
.terr-btn{
  height:38px; border-radius:6px; border:2px solid #443626; font-size:15px; position:relative;
  display:flex; align-items:center; justify-content:center;
}
.terr-btn.sel{border-color:var(--gold-bright); box-shadow:0 0 6px rgba(232,196,84,.5);}
.pal-row{display:flex; gap:6px; align-items:center; margin:6px 0;}
.pal-row label{color:var(--text-dim); flex:1;}
.pal-row input[type=number]{width:52px; background:#1d150d; border:1px solid #443626; color:var(--text); border-radius:4px; padding:3px 5px;}
.pal-row input[type=text]{flex:1; background:#1d150d; border:1px solid #443626; color:var(--text); border-radius:4px; padding:4px 6px; min-width:0;}
.pal-btn{
  width:100%; margin-top:6px; padding:7px; border-radius:6px; border:1px solid var(--panel-edge);
  background:var(--wood-light); color:var(--text); font-size:12px;
}
.pal-btn:hover{border-color:var(--gold);}
.pal-btn.primary{background:var(--gold); color:var(--ink); font-weight:bold;}
#maplib{display:flex; flex-direction:column; gap:4px;}
.maplib-item{display:flex; gap:4px; align-items:center; background:#1d150d; border:1px solid #443626; border-radius:5px; padding:4px 7px;}
.maplib-item span{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.maplib-item button{background:none; border:none; color:var(--text-dim); font-size:12px;}
.maplib-item button:hover{color:var(--gold-bright);}

/* ---------- Sidebar ---------- */
#sidebar{
  width:380px; flex-shrink:0; display:flex; flex-direction:column;
  background:var(--panel); border-left:2px solid var(--panel-edge); min-height:0;
}
#side-tabs{display:flex; border-bottom:1px solid var(--panel-edge); flex-shrink:0;}
.side-tab{
  flex:1; padding:9px 0; background:none; border:none; color:var(--text-dim);
  font-size:13px; border-bottom:2px solid transparent;
}
.side-tab.active{color:var(--gold-bright); border-bottom-color:var(--gold);}
.side-panel{flex:1; min-height:0; display:none; flex-direction:column;}
.side-panel.active{display:flex;}

/* ---------- Chat / story ---------- */
#chatlog{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:9px;}
.msg{border-radius:8px; padding:8px 11px; font-size:13.5px; line-height:1.45; max-width:100%; word-wrap:break-word;}
.msg-dm{background:var(--parch); color:var(--ink); border:1px solid #c9b98d; box-shadow:0 1px 3px rgba(0,0,0,.35);}
.msg-dm .who{color:#7a5a17;}
.msg-player{background:#3a4a5c; color:#e8eef4; align-self:flex-end; border:1px solid #4d6278;}
.msg-system{background:none; color:var(--text-dim); font-size:12px; font-style:italic; text-align:center; padding:2px;}
.msg-error{background:#4a2320; color:#f0c0ba; border:1px solid #7a3a32; font-size:12.5px; font-family:Verdana,sans-serif;}
.msg-roll{
  background:#26313a; color:#cfe0ee; border:1px solid #3b4d5e; font-family:Verdana,sans-serif; font-size:12px;
}
.msg-roll b{color:#fff; font-size:14px;}
.msg-roll .crit{color:#7ee07e; font-weight:bold;}
.msg-roll .fumble{color:#e07e7e; font-weight:bold;}
.msg .who{font-weight:bold; font-size:11px; text-transform:uppercase; letter-spacing:.6px; display:block; margin-bottom:3px; font-family:Verdana,sans-serif;}
.msg-dm p{margin-bottom:6px;} .msg-dm p:last-child{margin-bottom:0;}
.msg-dm em{color:#6b4f1d;}

.toolcard{
  background:#33261685; border:1px dashed var(--gold); border-radius:8px; padding:8px 11px;
  font-family:Verdana,sans-serif; font-size:12px;
}
.toolcard .tc-name{color:var(--gold-bright); font-weight:bold;}
.toolcard .tc-detail{color:var(--text-dim); margin:4px 0; font-size:11.5px; word-break:break-all;}
.toolcard .tc-actions{display:flex; gap:6px; margin-top:6px;}
.toolcard .tc-actions button{
  padding:4px 12px; border-radius:5px; border:1px solid var(--panel-edge); font-size:12px;
  background:var(--wood-light); color:var(--text);
}
.toolcard .tc-actions .ok{background:var(--green); border-color:#6a9a54; color:#fff;}
.toolcard .tc-actions .no{background:var(--red); border-color:#c05a4e; color:#fff;}
.toolcard.resolved{opacity:.62; border-style:solid; border-color:#5a4630;}
.toolcard .tc-status{font-style:italic; color:var(--text-dim); margin-top:4px;}

#dm-status{
  padding:4px 12px; font-size:11px; color:var(--text-dim); font-family:Verdana,sans-serif;
  display:flex; align-items:center; gap:8px; border-top:1px solid #3d2f1f; flex-shrink:0;
}
#dm-status .dot{width:8px; height:8px; border-radius:50%; background:#555; flex-shrink:0;}
#dm-status.thinking .dot{background:var(--gold-bright); animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.3;}}
#dm-status .spacer{flex:1;}
#undo-dm{background:none; border:1px solid #4d3a26; color:var(--text-dim); border-radius:4px; font-size:10px; padding:2px 7px;}
#undo-dm:hover{color:var(--gold-bright); border-color:var(--gold);}

#chatform{display:flex; gap:7px; padding:10px 12px; border-top:1px solid var(--panel-edge); flex-shrink:0;}
#chatinput{
  flex:1; background:#1d150d; border:1px solid #4d3a26; color:var(--text); border-radius:8px;
  padding:9px 12px; font-size:13.5px; resize:none; height:44px; line-height:1.4;
}
#chatinput:focus{outline:none; border-color:var(--gold);}
#chatsend{background:var(--gold); color:var(--ink); border:none; border-radius:8px; padding:0 16px; font-weight:bold; font-size:14px;}
#chatsend:disabled{opacity:.45; cursor:default;}
#story-topbar{
  display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid #3d2f1f;
  flex-shrink:0; font-family:Verdana,sans-serif; font-size:11px; color:var(--text-dim);
}
#autonomy-sel{background:#1d150d; color:var(--text); border:1px solid #4d3a26; border-radius:5px; padding:3px 6px; font-size:11px;}
#new-adventure{background:var(--red); color:#fff; border:none; border-radius:5px; padding:4px 10px; font-size:11px;}
#new-adventure:hover{background:#c04a3d;}

/* ---------- Party panel ---------- */
#party-list{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px;}
.pc-card{
  background:linear-gradient(#3b2c1b,#332517); border:1px solid var(--panel-edge); border-radius:10px;
  padding:10px 12px; display:flex; gap:12px; align-items:center; cursor:pointer;
}
.pc-card:hover{border-color:var(--gold);}
.pc-portrait{
  width:52px; height:52px; border-radius:50%; background:#1d150d; border:2px solid var(--gold);
  display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0;
}
.pc-info{flex:1; min-width:0;}
.pc-name{font-size:15px; color:var(--gold-bright); font-weight:bold;}
.pc-sub{font-size:11px; color:var(--text-dim); font-family:Verdana,sans-serif; margin:2px 0 5px;}
.bar{height:7px; background:#191209; border-radius:4px; overflow:hidden; margin-top:3px; border:1px solid #00000060;}
.bar i{display:block; height:100%; border-radius:4px; transition:width .3s;}
.bar-hp i{background:linear-gradient(90deg,#7ec26a,#4e7a3a);}
.bar-hp.low i{background:linear-gradient(90deg,#d67a5a,#a5372c);}
.bar-mana i{background:linear-gradient(90deg,#6a9ac2,#3b6b8a);}
.bar-label{font-size:10px; color:var(--text-dim); font-family:Verdana,sans-serif; display:flex; justify-content:space-between; margin-top:4px;}
#party-actions{padding:10px 12px; border-top:1px solid var(--panel-edge); display:flex; gap:8px; flex-shrink:0;}
.big-btn{
  flex:1; padding:10px; border-radius:8px; border:1px solid var(--panel-edge);
  background:var(--wood-light); color:var(--text); font-size:13px;
}
.big-btn:hover{border-color:var(--gold);}
.big-btn.primary{background:var(--gold); color:var(--ink); font-weight:bold;}
.empty-note{color:var(--text-dim); font-size:12.5px; font-style:italic; text-align:center; padding:26px 20px; line-height:1.6;}

/* ---------- Combat panel ---------- */
#combat-body{flex:1; overflow-y:auto; padding:12px;}
#init-list{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.init-row{
  display:flex; align-items:center; gap:9px; background:#271d11; border:1px solid #3d2f1f;
  border-radius:7px; padding:6px 10px; font-size:13px;
}
.init-row.current{border-color:var(--gold); background:#33260f; box-shadow:0 0 8px rgba(201,162,39,.3);}
.init-row .emoji{font-size:19px;}
.init-row .nm{flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.init-row .hp{font-size:11px; font-family:Verdana,sans-serif; color:var(--text-dim);}
.init-row .init{font-family:Verdana,sans-serif; font-size:12px; color:var(--gold-bright); width:22px; text-align:right;}
.init-row.dead{opacity:.45; text-decoration:line-through;}
.init-row.enemy .nm{color:#e0a29a;}
.init-row.party .nm{color:#cfe0b8;}
#action-panel{background:#271d11; border:1px solid var(--panel-edge); border-radius:9px; padding:11px; font-family:Verdana,sans-serif; font-size:12px;}
#action-panel h4{font-family:Georgia,serif; color:var(--gold-bright); font-size:14px; margin-bottom:7px;}
.econ{display:flex; gap:6px; margin-bottom:9px;}
.econ span{flex:1; text-align:center; padding:4px; border-radius:5px; background:#191209; color:var(--text-dim); font-size:10.5px; border:1px solid #33281a;}
.econ span.avail{color:#9ec27e; border-color:#4e7a3a;}
.act-btns{display:flex; flex-wrap:wrap; gap:6px;}
.act-btn{
  padding:6px 11px; border-radius:6px; border:1px solid var(--panel-edge); background:var(--wood-light);
  color:var(--text); font-size:12px;
}
.act-btn:hover:not(:disabled){border-color:var(--gold);}
.act-btn:disabled{opacity:.4; cursor:default;}
.act-btn.end{background:var(--red); color:#fff; border-color:#7a3a32;}
#combat-controls{padding:10px 12px; border-top:1px solid var(--panel-edge); display:flex; gap:8px; flex-shrink:0;}

/* ---------- Modals ---------- */
#modal-veil{
  position:fixed; inset:0; background:rgba(10,7,4,.75); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal{
  background:linear-gradient(#3b2c1b,#2c2013); border:2px solid var(--panel-edge); border-radius:14px;
  width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column;
  box-shadow:0 14px 50px rgba(0,0,0,.7);
}
.modal-head{
  display:flex; align-items:center; padding:14px 20px; border-bottom:1px solid var(--panel-edge); flex-shrink:0;
}
.modal-head h2{font-size:18px; color:var(--gold-bright); flex:1;}
.modal-x{background:none; border:none; color:var(--text-dim); font-size:20px;}
.modal-x:hover{color:#fff;}
.modal-body{padding:18px 20px; overflow-y:auto; font-size:13.5px;}
.modal-foot{
  display:flex; gap:10px; padding:13px 20px; border-top:1px solid var(--panel-edge);
  justify-content:flex-end; flex-shrink:0;
}
.m-btn{padding:9px 20px; border-radius:8px; border:1px solid var(--panel-edge); background:var(--wood-light); color:var(--text); font-size:13px;}
.m-btn.primary{background:var(--gold); color:var(--ink); font-weight:bold; border-color:var(--gold);}
.m-btn:disabled{opacity:.4; cursor:default;}
.m-btn:hover:not(:disabled){filter:brightness(1.12);}

.form-row{margin-bottom:13px;}
.form-row label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-dim); font-family:Verdana,sans-serif; margin-bottom:5px;}
.form-row input[type=text],.form-row input[type=password],.form-row select,.form-row textarea{
  width:100%; background:#1d150d; border:1px solid #4d3a26; border-radius:7px; color:var(--text);
  padding:9px 11px; font-size:13.5px;
}
.form-row textarea{resize:vertical; min-height:64px;}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none; border-color:var(--gold);}
.form-hint{font-size:11px; color:var(--text-dim); margin-top:4px; font-family:Verdana,sans-serif; line-height:1.5;}

/* ---------- Character creator ---------- */
.wiz-steps{display:flex; gap:3px; padding:0 20px; margin-top:12px; flex-shrink:0;}
.wiz-step{
  flex:1; text-align:center; font-size:10px; font-family:Verdana,sans-serif; color:var(--text-dim);
  padding:5px 2px; border-bottom:3px solid #443626; text-transform:uppercase; letter-spacing:.4px;
}
.wiz-step.on{color:var(--gold-bright); border-bottom-color:var(--gold);}
.wiz-step.done{color:#8fae76; border-bottom-color:#4e7a3a;}
.choice-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:9px;}
.choice-card{
  background:#271d11; border:2px solid #3d2f1f; border-radius:9px; padding:11px; cursor:pointer; text-align:center;
}
.choice-card:hover{border-color:#6a5335;}
.choice-card.sel{border-color:var(--gold-bright); background:#33260f; box-shadow:0 0 8px rgba(232,196,84,.35);}
.choice-card .cc-emoji{font-size:30px;}
.choice-card .cc-name{font-size:14px; color:var(--gold-bright); margin:4px 0 3px; font-weight:bold;}
.choice-card .cc-desc{font-size:11px; color:var(--text-dim); font-family:Verdana,sans-serif; line-height:1.45;}
.detail-box{
  background:#271d11; border:1px solid #3d2f1f; border-radius:9px; padding:12px 14px; margin-top:12px;
  font-size:12px; font-family:Verdana,sans-serif; color:var(--text-dim); line-height:1.55;
}
.detail-box b{color:var(--text);}
.abil-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:10px;}
.abil-cell{background:#271d11; border:1px solid #3d2f1f; border-radius:9px; padding:9px; text-align:center;}
.abil-cell .ab-name{font-size:10.5px; color:var(--text-dim); font-family:Verdana,sans-serif; text-transform:uppercase; letter-spacing:1px;}
.abil-cell .ab-score{font-size:23px; color:var(--gold-bright); font-weight:bold; margin:3px 0;}
.abil-cell .ab-mod{font-size:12px; color:var(--text-dim); font-family:Verdana,sans-serif;}
.abil-cell .ab-ctl{display:flex; justify-content:center; gap:7px; margin-top:5px;}
.abil-cell .ab-ctl button{
  width:24px; height:24px; border-radius:5px; border:1px solid var(--panel-edge); background:var(--wood-light);
  color:var(--text); font-size:14px; line-height:1;
}
.abil-cell .ab-ctl button:disabled{opacity:.3;}
.abil-cell select{width:100%; margin-top:5px; background:#1d150d; color:var(--text); border:1px solid #4d3a26; border-radius:5px; padding:3px;}
.method-tabs{display:flex; gap:6px; margin-bottom:5px;}
.method-tab{
  flex:1; padding:7px; border-radius:7px; border:1px solid #3d2f1f; background:#271d11;
  color:var(--text-dim); font-size:12px; font-family:Verdana,sans-serif;
}
.method-tab.on{border-color:var(--gold); color:var(--gold-bright); background:#33260f;}
.points-left{text-align:center; font-size:12px; color:var(--text-dim); font-family:Verdana,sans-serif; margin:8px 0;}
.points-left b{color:var(--gold-bright); font-size:15px;}
.skill-list{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
.skill-pick{
  display:flex; align-items:center; gap:8px; background:#271d11; border:1px solid #3d2f1f;
  border-radius:7px; padding:7px 10px; font-size:12.5px; cursor:pointer; font-family:Verdana,sans-serif;
}
.skill-pick.sel{border-color:var(--gold-bright); color:var(--gold-bright);}
.skill-pick.locked{opacity:.55; cursor:default;}
.skill-pick input{accent-color:var(--gold);}
.emoji-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:8px;}
.emoji-opt{
  font-size:23px; padding:6px 0; text-align:center; border-radius:8px; border:2px solid transparent;
  background:#271d11; cursor:pointer;
}
.emoji-opt.sel{border-color:var(--gold-bright); background:#33260f;}
.summary-sheet{display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; font-size:12.5px; font-family:Verdana,sans-serif;}
.summary-sheet dt{color:var(--text-dim); font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; margin-top:7px;}
.summary-sheet dd{color:var(--text);}

/* ---------- Character sheet ---------- */
.sheet-head{display:flex; gap:14px; align-items:center; margin-bottom:14px;}
.sheet-head .pc-portrait{width:64px; height:64px; font-size:34px;}
.sheet-stats{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:12px;}
.stat-pill{background:#271d11; border:1px solid #3d2f1f; border-radius:8px; text-align:center; padding:7px 2px;}
.stat-pill .sp-l{font-size:9.5px; color:var(--text-dim); font-family:Verdana,sans-serif; text-transform:uppercase;}
.stat-pill .sp-v{font-size:17px; color:var(--gold-bright); font-weight:bold;}
.stat-pill .sp-m{font-size:10.5px; color:var(--text-dim); font-family:Verdana,sans-serif;}
.sheet-sec{margin-bottom:13px;}

.sheet-sec .roll-row{

.inv-list{font-size:12.5px; font-family:Verdana,sans-serif; line-height:1.8;}
.tag{display:inline-block; background:#443626; border-radius:4px; padding:1px 7px; font-size:10.5px; margin:0 3px 3px 0; font-family:Verdana,sans-serif;}

/* ---------- Dice modal quick ---------- */

#dice-quick button{

  background:#271d11; color:var(--gold-bright); font-size:14px; font-weight:bold;
}

.dice-result-big{

<body>
<header id="topbar">
  <div id="logo">⚔️ Fableboard<small>a tabletop for grand tales</small></div>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="play">▶ Play</button>
    <button class="mode-tab" data-mode="edit">✏️ Map Editor</button>
  </div>
  <div class="spacer"></div>
  <button class="tb-btn" id="btn-dice" title="Dice roller">🎲 Dice</button>
  <button class="tb-btn" id="btn-export" title="Export campaign">📤 Export</button>
  <button class="tb-btn" id="btn-import" title="Import campaign">📥 Import</button>
  <button class="tb-btn" id="btn-settings" title="Settings">⚙️</button>
</header>
<main id="main">
  <div id="boardwrap">
    <canvas id="board"></canvas>
    <div id="board-tools">
      <button class="bt-btn" id="bt-zoomin" title="Zoom in">＋</button>
      <button class="bt-btn" id="bt-zoomout" title="Zoom out">－</button>
      <button class="bt-btn" id="bt-center" title="Center view">⌖</button>
      <button class="bt-btn" id="bt-measure" title="Measure distance">📏</button>
      <button class="bt-btn" id="bt-fog" title="Toggle fog rendering">🌫</button>
    </div>
    <div id="hoverinfo">—</div>
    <div id="turn-banner" class="hidden"></div>

    <div id="editor-palette" class="hidden">
      <h3>🛠 Map Editor</h3>
      <h4>Terrain brush</h4>
      <div class="terrain-grid" id="terrain-grid"></div>
      <div class="pal-row"><label>Brush size</label><input type="number" id="brush-size" min="1" max="6" value="1"></div>
      <h4>Fog of war</h4>
      <div class="pal-row">
        <button class="pal-btn" id="fog-reveal-all" style="margin-top:0">Reveal all</button>
        <button class="pal-btn" id="fog-hide-all" style="margin-top:0">Hide all</button>
      </div>
      <div class="pal-row"><label><input type="checkbox" id="fog-brush"> Fog brush (paint hide / shift-reveal)</label></div>
      <h4>Map</h4>
      <div class="pal-row"><label>Width</label><input type="number" id="map-w" min="10" max="80" value="30"></div>
      <div class="pal-row"><label>Height</label><input type="number" id="map-h" min="10" max="80" value="22"></div>
      <button class="pal-btn" id="map-resize">Apply size</button>
      <button class="pal-btn" id="map-clear">Clear map</button>
      <h4>Dungeon generator</h4>
      <div class="pal-row"><label>Rooms</label><input type="number" id="gen-rooms" min="3" max="16" value="7"></div>
      <div class="pal-row"><label>Seed</label><input type="text" id="gen-seed" placeholder="random"></div>
      <button class="pal-btn primary" id="gen-dungeon">⚒ Generate dungeon</button>
      <h4>Map library</h4>
      <div class="pal-row"><input type="text" id="map-name" placeholder="Map name…"></div>
      <button class="pal-btn" id="map-save">Save to library</button>
      <div id="maplib" style="margin-top:8px"></div>
    </div>
  </div>

  <aside id="sidebar">
    <div id="side-tabs">
      <button class="side-tab active" data-tab="story">📜 Story</button>
      <button class="side-tab" data-tab="party">🛡 Party</button>
      <button class="side-tab" data-tab="combat">⚔️ Combat</button>
    </div>

    <div class="side-panel active" id="tab-story">
      <div id="story-topbar">
        <span>DM control:</span>
        <select id="autonomy-sel">
          <option value="narrator">🗣 Narrator — suggests only</option>
          <option value="codm" selected>🤝 Co-DM — asks approval</option>
          <option value="full">🎩 Full DM — acts freely</option>
        </select>
        <span class="spacer" style="flex:1"></span>
        <button id="new-adventure">✨ New Adventure</button>
      </div>
      <div id="chatlog"></div>
      <div id="dm-status"><span class="dot"></span><span id="dm-status-text">DM idle</span><span class="spacer"></span><button id="undo-dm" class="hidden">↩ Undo DM action</button></div>
      <form id="chatform">
        <textarea id="chatinput" placeholder="Say or do something… (Enter to send)" rows="1"></textarea>
        <button type="submit" id="chatsend">➤</button>
      </form>
    </div>

    <div class="side-panel" id="tab-party">
      <div id="party-list"></div>
      <div id="party-actions">
        <button class="big-btn primary" id="btn-create-char">➕ Create Character</button>
      </div>
    </div>

    <div class="side-panel" id="tab-combat">
      <div id="combat-body">
        <div id="init-list"></div>
        <div id="action-panel"><div class="empty-note">No combat active.<br>Start combat to track initiative and take tactical turns.</div></div>
      </div>
      <div id="combat-controls">
        <button class="big-btn" id="btn-start-combat">⚔️ Start Combat</button>
        <button class="big-btn hidden" id="btn-end-combat">🕊 End Combat</button>
      </div>
    </div>
  </aside>
</main>
<div id="modals"></div>
<input type="file" id="import-file" accept=".json" style="display:none">

function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* ============================================================
   DICE ENGINE
   ============================================================ */
const Dice = {
  // Parse expressions like "2d6+3", "d20", "4d6kh3" (keep highest 3), "1d20adv", "1d20dis"
  roll(expr, opts = {}) {
    const cleaned = String(expr).toLowerCase().replace(/\s+/g, "");
    let adv = opts.adv || /adv$/.test(cleaned);
    let dis = opts.dis || /dis$/.test(cleaned);
    const core = cleaned.replace(/(adv|dis)$/, "");
    const parts = core.match(/^([+-]?\d*d\d+(?:kh\d+)?|[+-]?\d+)((?:[+-]\d*d\d+(?:kh\d+)?|[+-]\d+)*)$/);
    if (!parts) return null;
    const tokens = (core.match(/[+-]?\d*d\d+(?:kh\d+)?|[+-]?\d+/g)) || [];
    let total = 0; const detail = []; let d20 = null;
    for (const tok of tokens) {
      const sign = tok.startsWith("-") ? -1 : 1;
      const t = tok.replace(/^[+-]/, "");
      if (t.includes("d")) {
        let [nStr, rest] = t.split("d");
        let n = parseInt(nStr || "1", 10);
        let keep = null, faces;
        if (rest.includes("kh")) { const [f, k] = rest.split("kh"); faces = parseInt(f, 10); keep = parseInt(k, 10); }
        else faces = parseInt(rest, 10);
        if (!faces || n > 100) return null;
        // advantage/disadvantage applies to single d20 rolls
        if (faces === 20 && n === 1 && (adv || dis)) {
          const r1 = 1 + Math.floor(Math.random() * 20), r2 = 1 + Math.floor(Math.random() * 20);
          const pick = adv ? Math.max(r1, r2) : Math.min(r1, r2);
          detail.push(`d20(${adv ? "adv" : "dis"}:${r1},${r2}→${pick})`);
          total += sign * pick; d20 = pick;
        } else {
          const rolls = [];
          for (let i = 0; i < n; i++) rolls.push(1 + Math.floor(Math.random() * faces));
          let used = rolls;
          if (keep) used = [...rolls].sort((a, b) => b - a).slice(0, keep);
          const sum = used.reduce((a, b) => a + b, 0);
          detail.push(`${n}d${faces}${keep ? "kh" + keep : ""}(${rolls.join(",")})`);
          total += sign * sum;
          if (faces === 20 && n === 1) d20 = rolls[0];
        }
      } else {
        total += sign * parseInt(t, 10);
        detail.push(tok.startsWith("-") ? tok : (detail.length ? "+" + t : t));
      }
    }
    return { total, detail: detail.join(" "), d20, crit: d20 === 20, fumble: d20 === 1 };
  },

  // Roll and post to the chat log. who = display name
  post(expr, { who = "Dice", reason = "", adv = false, dis = false, vs = null } = {}) {
    const r = this.roll(expr, { adv, dis });
    if (!r) { Chat.system(`Could not parse dice expression "${esc(expr)}"`); return null; }
    let outcome = "";
    if (vs != null) outcome = r.total >= vs ? " — <span class='crit'>success</span>" : " — <span class='fumble'>failure</span>";
    let critTag = r.crit ? " <span class='crit'>CRIT!</span>" : r.fumble ? " <span class='fumble'>natural 1</span>" : "";
    Chat.add({ type: "roll", html:
      `<span class="who">🎲 ${esc(who)}${reason ? " — " + esc(reason) : ""}${vs != null ? " (DC " + vs + ")" : ""}</span>` +
      `<b>${r.total}</b> <span style="opacity:.75">⟵ ${esc(expr)} ${esc(r.detail)}</span>${critTag}${outcome}` });
    return r;
  },
};
