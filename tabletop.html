        entry: { type: "string", description: "Log entry to append" } },
        required: ["entry"] } },
  ],

  /* ---------- system prompt ---------- */
  rulesDigest() {
    return `FABLE d20 RULES (summary):
- Core roll: d20 + ability mod + proficiency (if proficient) vs DC or AC. Advantage/disadvantage = roll twice take best/worst.
- Abilities: STR DEX CON INT WIS CHA. Mod = (score-10)/2. Proficiency: +2 (lvl 1-4), +3 (lvl 5).
- Distances in 5-ft squares. Melee = 1 square. Turn = Move (speed) + 1 Action + 1 Quick action.
- Casters spend mana = spell tier. Spell save DC = 8 + prof + casting mod.
- Typical DCs: easy 8, medium 12, hard 15, very hard 18.
- Conditions: prone, poisoned, stunned, restrained, frightened, invisible, blessed, shielded, slowed, marked, charmed, mocked.
- Monsters available (id: threat): ${Object.entries(RULES.monsters).map(([id, m]) => `${id}(${m.threat})`).join(", ")}. Threat ≈ how many level-1 heroes it challenges; aim total threat ≈ party size × average level for a fair fight.`;
  },
  stateDigest() {
    const lines = [];
    lines.push(`MAP: ${S.map.w}x${S.map.h} "${S.map.name}". Coordinates are (x,y), 0-indexed, x→right y→down.`);
    const fogged = S.map.fog.filter(Boolean).length;
    lines.push(`Fog: ${fogged} of ${S.map.fog.length} cells hidden.`);
    if (S.party.length) {
      lines.push("PARTY:");
      for (const c of S.party) {
        const tok = Tokens.forChar(c);
        lines.push(`- ${Characters.summaryLine(c)}${tok ? ` @(${tok.x},${tok.y})` : " (no token)"}${c.backstory ? ` | backstory: ${c.backstory}` : ""}` +
          (c.spells?.length ? ` | spells: ${c.spells.map(s => RULES.spells[s]?.name).join(", ")}` : ""));
      }
    } else lines.push("PARTY: none yet — invite the player to create characters.");
    const npcs = S.tokens.filter(t => !t.charId);
    if (npcs.length) {
      lines.push("OTHER TOKENS:");
      for (const t of npcs.slice(0, 30))
        lines.push(`- ${t.name} [${t.team}] @(${t.x},${t.y}) HP ${t.hp}/${t.maxHp} AC ${t.ac}${t.dead ? " DEAD" : ""}${t.conditions.length ? " " + t.conditions.join(",") : ""}`);
    }
    if (S.combat.active) {
      const cur = Combat.currentToken();
      lines.push(`COMBAT ACTIVE: round ${S.combat.round}, current turn: ${cur ? cur.name : "?"}. Order: ${S.combat.order.map(id => Tokens.get(id)?.name).filter(Boolean).join(" → ")}.`);
    } else lines.push("No combat active.");
    if (S.quest.title || S.quest.log.length) {
      lines.push(`QUEST: ${S.quest.title || "(untitled)"}${S.quest.premise ? " — premise: " + S.quest.premise : ""}`);
      for (const e of S.quest.log.slice(-12)) lines.push(`  • ${e}`);
    }
    return lines.join("\n");
  },
  systemPrompt() {
    const autonomy = S.settings.autonomy;
    const autonomyNote = {
      narrator: "AUTONOMY: Narrator mode — your tool calls become suggestions the player applies manually. Narrate richly; suggest board actions sparingly.",
      codm: "AUTONOMY: Co-DM mode — each tool call is shown to the player for approval before it executes. A denied call is not a failure; adapt gracefully.",
      full: "AUTONOMY: Full DM mode — your tool calls execute immediately. Drive the board confidently.",
    }[autonomy];
    return `You are the Dungeon Master for "Fableboard", a virtual tabletop running the Fable d20 system. You are a warm, vivid, fair storyteller in the tradition of the great tabletop DMs.

${this.rulesDigest()}

HOW TO RUN THE GAME:
- Narrate in second person, 2-6 sentences per beat. Evocative but never purple. End most turns with a hook or a question: what does the player do?
- Use tools to make the board match the fiction: spawn monsters when they appear, reveal_area as the party explores, generate_dungeon when entering a new site, start_combat when blades are drawn.
- Ask for rolls with request_player_roll when outcomes are uncertain and failure is interesting. Roll monster attacks/saves yourself with roll_dice, then apply_damage.
- During combat, run ONLY the enemy turns (when the state digest says it's an enemy's turn): move_token, roll_dice for attacks vs the target's AC, apply_damage on hits, then narrate. Never take actions for player characters — describe the situation and let them act.
- Track the story with update_quest at meaningful moments. Award xp/gold/items when earned (a fair fight ≈ 100 XP × total threat, split by the tool automatically per character).
- Respect established facts in the quest log and conversation. Keep NPCs consistent.
- Keep the party's actual positions and stats (in the CURRENT STATE below) authoritative — never invent HP totals or positions.

${autonomyNote}

CURRENT STATE:
${this.stateDigest()}`;
  },

  /* ---------- API plumbing ---------- */
  async callClaude(messages) {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": S.settings.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: S.settings.model || "claude-opus-4-8",
        max_tokens: 4096,
        system: this.systemPrompt(),
        tools: this.tools,
        messages,
      }),
    });
    if (!res.ok) {
      let detail = "";
      try { detail = (await res.json()).error?.message || ""; } catch (e) {}
      const hints = {
        401: "Check your API key in ⚙️ Settings.",
        403: "Your key lacks permission for this model.",
        404: "Unknown model — pick another in ⚙️ Settings.",
        429: "Rate limited — wait a moment and try again.",
        529: "The API is overloaded — try again shortly.",
      };
      throw new Error(`API error ${res.status}: ${esc(detail)} ${hints[res.status] || ""}`);
    }
    return res.json();
  },

  status(text, thinking = false) {
    $("#dm-status-text").textContent = text;
    $("#dm-status").classList.toggle("thinking", thinking);
  },

  trimHistory() {
    // Keep history bounded. Trim only at user-text boundaries so tool_use/tool_result pairs stay intact.
    const msgs = S.dmMessages;
    if (msgs.length <= 40) return;
    let cut = msgs.length - 30;
    while (cut > 0 && !(msgs[cut].role === "user" && typeof msgs[cut].content === "string")) cut--;
    if (cut > 0) {
      S.dmMessages = msgs.slice(cut);
      S.quest.log.push("(Earlier events are summarized in this quest log — older dialogue trimmed.)");
    }
  },

  /* ---------- main send loop ---------- */
  async send(userText) {
    if (this.busy) return;
    if (!S.settings.mock && !S.settings.apiKey) {
      Chat.error(`No API key set. Open <b>⚙️ Settings</b> to add your Anthropic API key — or enable <b>Mock DM</b> there to try the tool pipeline offline.`);
      Settings.open();
      return;
    }
    this.busy = true;
    $("#chatsend").disabled = true;
    if (userText != null) {
      S.dmMessages.push({ role: "user", content: userText });
    }
    this.snapshot();
    try {
      if (S.settings.mock) await MockDM.run(userText);
      else await this.loop();
    } catch (e) {
      Chat.error(esc(e.message || String(e)));
      // roll back a dangling user message so a retry is clean
      const last = S.dmMessages[S.dmMessages.length - 1];
      if (last && last.role === "user" && typeof last.content === "string") S.dmMessages.pop();
    } finally {
      this.busy = false;
      $("#chatsend").disabled = false;
      this.status("DM idle");
      saveSoon();
    }
  },
  async loop() {
    let rounds = 0;
    while (rounds++ < 10) {
      this.status("The DM is thinking…", true);
      const res = await this.callClaude(S.dmMessages);
      S.dmMessages.push({ role: "assistant", content: res.content });

      // render text blocks
      for (const block of res.content) {
        if (block.type === "text" && block.text.trim()) Chat.dm(block.text.trim());
      }
      if (res.stop_reason !== "tool_use") break;

      const toolUses = res.content.filter(b => b.type === "tool_use");
      this.status("The DM acts on the board…", true);
      const results = [];
      for (const tu of toolUses) {
        const result = await this.gateAndExecute(tu);
        results.push({ type: "tool_result", tool_use_id: tu.id, content: result });
      }
      S.dmMessages.push({ role: "user", content: results });
      this.trimHistory();
      saveSoon();
    }
  },

  /* ---------- autonomy gate ---------- */
  async gateAndExecute(tu) {
    const mode = S.settings.autonomy;
    const detail = this.describeTool(tu.name, tu.input);
    if (tu.name === "request_player_roll") {
      // always goes to the player regardless of autonomy
      return await this.playerRollCard(tu.input);
    }
    if (mode === "full") {
      const r = this.execute(tu.name, tu.input);
      Chat.add({ type: "toolcard", tool: detail.title, detail: detail.text, status: "✓ " + r });
      $("#undo-dm").classList.remove("hidden");
      return r;
    }
    if (mode === "narrator") {
      Chat.add({ type: "toolcard", tool: "Suggestion: " + detail.title, detail: detail.text,
        status: "The DM suggests this — apply it manually on the board if you like." });
      return "Narrator mode: this action was shown to the player as a suggestion only. It was NOT executed — do not assume it happened. Continue narrating.";
    }
    // co-dm: approval card
    return await new Promise(resolve => {
      const card = document.createElement("div");
      card.className = "toolcard";
      card.innerHTML = `<span class="tc-name">🛠 The DM wants to: ${esc(detail.title)}</span>
        <div class="tc-detail">${esc(detail.text)}</div>
        <div class="tc-actions"><button class="ok">✓ Allow</button><button class="no">✗ Deny</button></div>`;
      $("#chatlog").appendChild(card);
      $("#chatlog").scrollTop = $("#chatlog").scrollHeight;
      const finish = (allowed) => {
        card.querySelector(".tc-actions").remove();
        card.classList.add("resolved");
        let result;
        if (allowed) {
          result = this.execute(tu.name, tu.input);
          card.insertAdjacentHTML("beforeend", `<div class="tc-status">✓ ${esc(result)}</div>`);
          S.chat.push({ type: "toolcard", tool: detail.title, detail: detail.text, status: "✓ " + result, t: Date.now() });
          $("#undo-dm").classList.remove("hidden");
        } else {
          result = "The player DENIED this action. Do not retry it; adapt the story.";
          card.insertAdjacentHTML("beforeend", `<div class="tc-status">✗ Denied</div>`);
          S.chat.push({ type: "toolcard", tool: detail.title, detail: detail.text, status: "✗ Denied", t: Date.now() });
        }
        saveSoon();
        resolve(result);
      };
      card.querySelector(".ok").onclick = () => finish(true);
      card.querySelector(".no").onclick = () => finish(false);
    });
  },
  playerRollCard(input) {
    return new Promise(resolve => {
      const c = S.party.find(p => p.name.toLowerCase().includes(String(input.character || "").toLowerCase())) || S.party[0];
      if (!c) { resolve("No such character in the party."); return; }
      const skillId = String(input.skill || "").toLowerCase();
      let mod, label;
      if (RULES.skills[skillId]) { mod = Characters.skillMod(c, skillId); label = RULES.skills[skillId].name + " check"; }
      else if (RULES.abilities.includes(skillId)) {
        mod = Characters.mod(c, skillId);
        if (RULES.classes[c.klass].saves.includes(skillId)) mod += Characters.prof(c);
        label = skillId.toUpperCase() + " save";
      } else { resolve(`Unknown skill "${input.skill}". Use one of: ${Object.keys(RULES.skills).join(", ")} or an ability.`); return; }
      const card = document.createElement("div");
      card.className = "toolcard";
      card.innerHTML = `<span class="tc-name">🎲 ${esc(c.name)}: ${esc(label)} — DC ${input.dc}</span>
        <div class="tc-detail">${esc(input.reason || "")}</div>
        <div class="tc-actions"><button class="ok">🎲 Roll d20${fmtMod(mod)}</button></div>`;
      $("#chatlog").appendChild(card);
      $("#chatlog").scrollTop = $("#chatlog").scrollHeight;
      card.querySelector(".ok").onclick = () => {
        card.querySelector(".tc-actions").remove();
        card.classList.add("resolved");
        const r = Dice.post(`1d20${mod >= 0 ? "+" + mod : mod}`, { who: c.name, reason: label, vs: input.dc });
        const success = r.total >= input.dc;
        card.insertAdjacentHTML("beforeend", `<div class="tc-status">${success ? "✓ Success" : "✗ Failure"} (${r.total} vs DC ${input.dc})</div>`);
        S.chat.push({ type: "toolcard", tool: `${c.name}: ${label}`, detail: input.reason || "", status: `${success ? "Success" : "Failure"} — rolled ${r.total} vs DC ${input.dc}`, t: Date.now() });
        resolve(`${c.name} rolled ${r.total} on the ${label} (DC ${input.dc}): ${success ? "SUCCESS" : "FAILURE"}${r.crit ? " (natural 20!)" : r.fumble ? " (natural 1!)" : ""}`);
      };
    });
  },

  describeTool(name, input) {
    const i = input || {};
    switch (name) {
      case "roll_dice": return { title: `Roll ${i.expression}`, text: i.reason || "" };
      case "spawn_token": return { title: `Spawn ${i.count > 1 ? i.count + "× " : ""}${i.name}`, text: `${i.monster_id ? "bestiary: " + i.monster_id + ", " : ""}team ${i.team || "enemy"} at (${i.x},${i.y})` };
      case "move_token": return { title: `Move ${i.token}`, text: `to (${i.x},${i.y})` };
      case "remove_token": return { title: `Remove ${i.token}`, text: "" };
      case "apply_damage": return { title: `${i.amount} damage to ${i.token}`, text: i.type || "" };
      case "heal_token": return { title: `Heal ${i.token} for ${i.amount}`, text: "" };
      case "set_condition": return { title: `${i.active === false ? "Clear" : "Apply"} ${i.condition} on ${i.token}`, text: "" };
      case "reveal_area": return { title: `Reveal area`, text: `around (${i.x},${i.y}) radius ${i.radius || 6}` };
      case "generate_dungeon": return { title: `Generate a new dungeon`, text: `${i.rooms || 7} rooms${i.theme ? ", " + i.theme : ""}${i.seed ? ", seed " + i.seed : ""} — replaces the current map!` };
      case "paint_terrain": return { title: `Paint ${i.terrain}`, text: `at (${i.x},${i.y}) size ${i.w || 1}×${i.h || 1}` };
      case "start_combat": return { title: "Start combat", text: "Rolls initiative for everyone on the board" };
      case "end_combat": return { title: "End combat", text: i.reason || "" };
      case "award": return { title: "Award the party", text: [i.xp && i.xp + " XP", i.gold && i.gold + " gold", i.items?.length && i.items.join(", ")].filter(Boolean).join(" · ") };
      case "update_quest": return { title: "Update quest log", text: (i.title ? "“" + i.title + "” — " : "") + (i.entry || "") };
      default: return { title: name, text: JSON.stringify(i) };
    }
  },

  /* ---------- tool execution (one code path shared with the UI) ---------- */
  execute(name, input) {
    const i = input || {};
    try {
      switch (name) {
        case "roll_dice": {
          const r = Dice.post(i.expression, { who: "DM", reason: i.reason || "", vs: i.dc ?? null });
          if (!r) return `Could not parse "${i.expression}".`;
          return `Rolled ${i.expression}${i.reason ? " (" + i.reason + ")" : ""}: total ${r.total}${r.d20 ? ` (d20=${r.d20})` : ""}${i.dc != null ? (r.total >= i.dc ? " — SUCCESS vs DC " + i.dc : " — FAILURE vs DC " + i.dc) : ""}.`;
        }
        case "spawn_token": {
          const count = clamp(i.count || 1, 1, 8);
          const mon = i.monster_id ? RULES.monsters[i.monster_id] : null;
          const made = [];
          for (let n = 0; n < count; n++) {
            const pos = Tokens.findOpenCell(clamp(i.x, 0, S.map.w - 1), clamp(i.y, 0, S.map.h - 1));
            const tok = Tokens.create({
              name: i.name, emoji: i.emoji || mon?.emoji || "❓",
              team: i.team || "enemy", x: pos.x, y: pos.y,
              hp: i.hp ?? mon?.hp ?? 10, ac: i.ac ?? mon?.ac ?? 10, speed: i.speed ?? mon?.speed ?? 6,
              monsterId: i.monster_id || null,
            });
            made.push(`${tok.name}@(${tok.x},${tok.y})`);
          }
          App.renderAll();
          return `Spawned: ${made.join(", ")}.`;
        }
        case "move_token": {
          const tok = Tokens.byName(i.token);
          if (!tok) return `No token named "${i.token}". Tokens: ${S.tokens.map(t => t.name).join(", ")}.`;
          tok.x = clamp(i.x, 0, S.map.w - 1); tok.y = clamp(i.y, 0, S.map.h - 1);
          if (tok.team === "party") Board.revealAround(tok.x, tok.y, 6);
          Board.draw();
          return `${tok.name} moved to (${tok.x},${tok.y}).`;
        }
        case "remove_token": {
          const tok = Tokens.byName(i.token);
          if (!tok) return `No token named "${i.token}".`;
          Tokens.remove(tok.id); App.renderAll();
          return `${tok.name} removed.`;
        }
        case "apply_damage": {
          const tok = Tokens.byName(i.token);
          if (!tok) return `No token named "${i.token}".`;
          Tokens.applyDamage(tok, i.amount, i.type || "");
          return `${tok.name} took ${i.amount} damage — now ${tok.hp}/${tok.maxHp} HP${tok.hp === 0 ? (tok.team === "party" ? " (DOWN and dying)" : " (DEAD)") : ""}.`;
        }
        case "heal_token": {
          const tok = Tokens.byName(i.token);
          if (!tok) return `No token named "${i.token}".`;
          Tokens.heal(tok, i.amount);
          return `${tok.name} healed — now ${tok.hp}/${tok.maxHp} HP.`;
        }
        case "set_condition": {
          const tok = Tokens.byName(i.token);
          if (!tok) return `No token named "${i.token}".`;
          const ok = Tokens.setCondition(tok, i.condition, i.active !== false);
          return ok ? `${tok.name}: ${i.condition} ${i.active === false ? "removed" : "applied"}.` : `Unknown condition "${i.condition}".`;
        }
        case "reveal_area": {
          Board.revealAround(clamp(i.x, 0, S.map.w - 1), clamp(i.y, 0, S.map.h - 1), i.radius || 6);
          return `Revealed radius ${i.radius || 6} around (${i.x},${i.y}).`;
        }
        case "generate_dungeon": {
          const res = Dungeon.generate({ rooms: i.rooms || 7, w: i.width, h: i.height, seed: i.seed, theme: i.theme || "dungeon" });
          const rooms = res.rooms.map((r, n) => `room${n + 1}@(${r.cx},${r.cy})${r.w}x${r.h}`).join(", ");
          App.renderAll();
          return `New dungeon generated (${S.map.w}x${S.map.h}). Party placed in room 1. Rooms: ${rooms}. Everything is fogged except the first room — reveal as they explore, and consider spawning inhabitants in the other rooms.`;
        }
        case "paint_terrain": {
          const terr = Object.values(TERRAIN).find(t => t.name.toLowerCase() === String(i.terrain).toLowerCase() || (i.terrain === "difficult" && t === TERRAIN.ROUGH));
          const tid = i.terrain === "difficult" ? TERRAIN.ROUGH.id : terr?.id;
          if (tid == null) return `Unknown terrain "${i.terrain}".`;
          const w = clamp(i.w || 1, 1, S.map.w), h = clamp(i.h || 1, 1, S.map.h);
          for (let y = i.y; y < i.y + h; y++) for (let x = i.x; x < i.x + w; x++) {
            if (x >= 0 && y >= 0 && x < S.map.w && y < S.map.h) S.map.terrain[y * S.map.w + x] = tid;
          }
          Board.draw();
          return `Painted ${i.terrain} at (${i.x},${i.y}) ${w}×${h}.`;
        }
        case "start_combat": {
          if (S.combat.active) return "Combat is already active.";
          const ok = Combat.start();
          if (!ok) return "Could not start combat — need at least one party token and one enemy token on the board.";
          const cur = Combat.currentToken();
          return `Combat started. Initiative order: ${S.combat.order.map(id => Tokens.get(id)?.name).join(" → ")}. First up: ${cur?.name}${cur?.team === "enemy" ? " (an enemy — run its turn now)" : " (a player — let them act)"}.`;
        }
        case "end_combat": {
          if (!S.combat.active) return "No combat active.";
          Combat.end(i.reason || "");
          return "Combat ended.";
        }
        case "award": {
          const targets = i.character ? S.party.filter(c => c.name.toLowerCase().includes(i.character.toLowerCase())) : S.party;
          if (!targets.length) return "No matching characters.";
          const notes = [];
          for (const c of targets) {
            if (i.xp) { Characters.awardXp(c, i.xp); notes.push(`${c.name}+${i.xp}xp(lvl ${c.level})`); }
            if (i.gold) { c.gold += i.gold; }
            if (i.items?.length) c.inventory.push(...i.items);
          }
          if (i.gold) Chat.system(`💰 ${targets.map(c => esc(c.name)).join(", ")} gain${targets.length === 1 ? "s" : ""} <b>${i.gold} gold</b>.`);
          if (i.items?.length) Chat.system(`🎁 Received: <b>${i.items.map(esc).join(", ")}</b>`);
          App.renderAll();
          return `Awarded${i.xp ? ` ${i.xp} XP` : ""}${i.gold ? ` ${i.gold} gold` : ""}${i.items?.length ? ` items: ${i.items.join(", ")}` : ""} to ${targets.map(c => c.name).join(", ")}. ${notes.join(" ")}`;
        }
        case "update_quest": {
          if (i.title) S.quest.title = i.title;
          if (i.entry) S.quest.log.push(i.entry);
          saveSoon();
          return "Quest log updated.";
        }
        default: return `Unknown tool "${name}".`;
      }
    } catch (e) {
      return `Tool error: ${e.message}`;
    }
  },

  /* ---------- undo ---------- */
  snapshot() {
    this.undoSnapshot = JSON.stringify({ tokens: S.tokens, map: S.map, combat: S.combat, party: S.party });
  },
  undo() {
    if (!this.undoSnapshot) return;
    const snap = JSON.parse(this.undoSnapshot);
    S.tokens = snap.tokens; S.map = snap.map; S.combat = snap.combat; S.party = snap.party;
    this.undoSnapshot = null;
    $("#undo-dm").classList.add("hidden");
    Chat.system("↩ Rolled the board back to before the DM's last turn.");
    App.renderAll(); saveSoon();
  },

  /* ---------- new adventure ---------- */
  newAdventure() {
    Modal.open({
      title: "✨ New Adventure",
      body: `
        <div class="form-row"><label>Premise — what tale shall we tell?</label>
          <textarea id="adv-premise" placeholder="e.g. A haunted keep looms over the village of Bram's Hollow…"></textarea>
          <div class="form-hint">Leave blank and the DM will invent one. Your party: ${S.party.length ? S.party.map(c => esc(c.name)).join(", ") : "<b>empty — create characters first!</b>"}</div>
        </div>
        <div class="form-row"><label>Or pick a seed</label>
          <select id="adv-seed">
            <option value="">— custom / surprise me —</option>
            <option>The Haunted Keep of Bram's Hollow</option>
            <option>The Sunken Temple of the Serpent God</option>
            <option>Goblin Trouble on the King's Road</option>
            <option>The Necromancer's Winter</option>
            <option>Dragon Rumors in the Ember Peaks</option>
          </select>
        </div>
        <div class="form-hint">⚠️ Starting a new adventure clears the story log and quest journal (your heroes, maps, and settings are kept).</div>`,
      foot: `<button class="m-btn" id="adv-cancel">Cancel</button><button class="m-btn primary" id="adv-go">Begin the Tale</button>`,
    });
    $("#adv-cancel").onclick = () => Modal.close();
    $("#adv-go").onclick = () => {
      const premise = $("#adv-premise").value.trim() || $("#adv-seed").value || "";
      Modal.close();
      S.chat = []; S.dmMessages = []; S.quest = { title: "", premise, log: [] };
      Chat.renderAll();
      Chat.system("✨ <b>A new adventure begins…</b>");
      const kickoff = premise
        ? `Begin a brand-new adventure with this premise: "${premise}". Set the opening scene, introduce the party, and prepare the first map (generate_dungeon or paint what you need). If the party is empty, instead welcome me and ask me to create characters.`
        : `Begin a brand-new adventure of your own invention, suited to this party. Set the opening scene and prepare the first map. If the party is empty, instead welcome me and ask me to create characters.`;
      DM.send(kickoff);
    };
  },
};

/* ============================================================
   MOCK DM — offline demo of the full tool pipeline
   ============================================================ */
const MockDM = {
  step: 0,
  async run(userText) {
    DM.status("Mock DM acting…", true);
    const scripts = this.script();
    const scene = scripts[Math.min(this.step, scripts.length - 1)];
    this.step++;
    for (const beat of scene) {
      await new Promise(r => setTimeout(r, 250));
      if (beat.say) Chat.dm(beat.say);
      if (beat.tool) {
        const tu = { id: "mock_" + uid(), name: beat.tool, input: beat.input };
        const result = await DM.gateAndExecute(tu);
        console.log("[mock tool]", beat.tool, "→", result);
      }
    }
  },
  script() {
    const cx = Math.floor(S.map.w / 2), cy = Math.floor(S.map.h / 2);
    return [
      [ { say: "*The Mock DM clears its throat.* Welcome, traveler! I'm a scripted stand-in that exercises the real tool pipeline — watch me build a scene. **No API key required.**" },
        { tool: "update_quest", input: { title: "The Mock Dungeon", entry: "The party stepped into a demonstration." } },
        { tool: "generate_dungeon", input: { rooms: 6, seed: "mockery" } },
        { say: "Stone corridors stretch into darkness ahead. From somewhere deeper, you hear the *skitter of clawed feet*. What do you do?" } ],
      [ { say: "As you press on, shapes emerge from the gloom — **goblins**, blades bared!" },
        { tool: "spawn_token", input: { name: "Goblin", monster_id: "goblin", team: "enemy", x: cx + 3, y: cy, count: 2 } },
        { tool: "roll_dice", input: { expression: "1d20+2", reason: "Goblin war-cry (intimidation)", dc: 12 } },
        { tool: "start_combat", input: {} },
        { say: "Steel rings out — **initiative is rolled!** Fight from the Combat tab; I'll cheer from here." } ],
      [ { say: "The Mock DM waves a scripted hand and the wounds close." },
        { tool: "end_combat", input: { reason: "The demonstration concludes." } },
        { tool: "award", input: { xp: 60, gold: 15, items: ["Mock Trophy"] } },
        { say: "That's the whole loop — narration, dice, tokens, combat, loot — through the same dispatcher the real DM uses. Add an API key in ⚙️ Settings for the genuine article. *(Further messages repeat this final beat.)*" } ],
    ];
  },
};

          <select id="set-autonomy">
            <option value="narrator">🗣 Narrator — narrates only; board actions become suggestions</option>
            <option value="codm">🤝 Co-DM — asks your approval for each board action</option>
            <option value="full">🎩 Full DM — acts on the board freely (with undo)</option>
          </select>
        </div>
        <div class="form-row"><label><input type="checkbox" id="set-mock" ${S.settings.mock ? "checked" : ""}> Mock DM mode (offline demo, no API key needed)</label></div>
        <div class="form-row"><label>Danger zone</label>
          <button class="m-btn" id="set-wipe" style="border-color:#7a3a32;color:#e0a29a">🗑 Erase entire campaign</button>
        </div>`,
      foot: `<button class="m-btn primary" id="set-save">Save</button>`,
    });
    $("#set-model").value = S.settings.model || "claude-opus-4-8";
    $("#set-autonomy").value = S.settings.autonomy;
    $("#set-save").onclick = () => {
      S.settings.apiKey = $("#set-key").value.trim();
      S.settings.model = $("#set-model").value;
      S.settings.autonomy = $("#set-autonomy").value;
      S.settings.mock = $("#set-mock").checked;
      $("#autonomy-sel").value = S.settings.autonomy;
      State.save(); Modal.close();
      Chat.system("Settings saved." + (S.settings.mock ? " <b>Mock DM enabled.</b>" : ""));
    };
    $("#set-wipe").onclick = () => {
      if (!confirm("Erase EVERYTHING — party, maps, story? This cannot be undone.")) return;
      localStorage.removeItem("fableboard_save");
      location.reload();
    };
  },
};

/* ============================================================
   DICE MODAL
   ============================================================ */
const DiceUI = {
  open() {
    Modal.open({
      title: "🎲 Dice Roller",
      body: `
        <div id="dice-quick">
          ${[4, 6, 8, 10, 12, 20, 100].map(f => `<button data-d="${f}">d${f}</button>`).join("")}
        </div>
        <div class="form-row"><label>Custom expression</label>
          <input type="text" id="dice-expr" placeholder="e.g. 2d6+3, 4d6kh3, 1d20adv">
        </div>
        <div class="dice-result-big" id="dice-out">—</div>`,
      foot: `<button class="m-btn primary" id="dice-roll">Roll</button>`,
    });
    const out = $("#dice-out");
    const doRoll = expr => {
      const r = Dice.post(expr, { who: "You" });
      if (r) out.innerHTML = `${r.total}<small>${esc(expr)} — ${esc(r.detail)}</small>`;
      else out.innerHTML = `?<small>couldn't parse that</small>`;
    };
    $$("#dice-quick button").forEach(b => b.onclick = () => doRoll("1d" + b.dataset.d));
    $("#dice-roll").onclick = () => doRoll($("#dice-expr").value.trim() || "1d20");
    $("#dice-expr").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#dice-roll").click(); } });
  },
};

/* ============================================================
   APP — init & wiring
   ============================================================ */
const App = {
  mode: "play",
  init() {
    const hadSave = State.load();
    S = State.data;
    Chat.init();
    Board.init();
    Editor.init();
    this.wire();
    this.renderAll();
    $("#autonomy-sel").value = S.settings.autonomy;
    if (!hadSave) {
      Chat.system(`<b>Welcome to Fableboard!</b> 🎲`);
      Chat.system(`1️⃣ Create a hero in the <b>🛡 Party</b> tab &nbsp;2️⃣ add your Anthropic API key in <b>⚙️ Settings</b> (or enable the offline <b>Mock DM</b>) &nbsp;3️⃣ hit <b>✨ New Adventure</b> and tell the DM what tale you crave.`);
      Chat.system(`Prefer to be your own DM? Use the <b>✏️ Map Editor</b>, place monsters via the DM's suggestions or the editor, and run tactical combat from the <b>⚔️ Combat</b> tab.`);
    }
    setInterval(() => State.save(), 6000);
    window.addEventListener("beforeunload", () => State.save());
  },
  wire() {
    // mode tabs
    $$(".mode-tab").forEach(t => t.onclick = () => this.switchMode(t.dataset.mode));
    // sidebar tabs
    $$(".side-tab").forEach(t => t.onclick = () => this.switchTab(t.dataset.tab));
    // top bar
    $("#btn-dice").onclick = () => DiceUI.open();
    $("#btn-settings").onclick = () => Settings.open();
    $("#btn-export").onclick = () => State.export();
    $("#btn-import").onclick = () => $("#import-file").click();
    $("#import-file").onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { try { State.import(rd.result); } catch (err) { alert("Import failed: " + err.message); } };
      rd.readAsText(f);
      e.target.value = "";
    };
    // board tools
    $("#bt-zoomin").onclick = () => { Board.zoom = clamp(Board.zoom * 1.25, .35, 3); Board.draw(); };
    $("#bt-zoomout").onclick = () => { Board.zoom = clamp(Board.zoom / 1.25, .35, 3); Board.draw(); };
    $("#bt-center").onclick = () => Board.center();
    $("#bt-measure").onclick = () => {
      Board.measureMode = !Board.measureMode; Board.measureFrom = null;
      $("#bt-measure").classList.toggle("on", Board.measureMode);
      Board.draw();
    };
    $("#bt-fog").onclick = () => {
      Board.showFog = !Board.showFog;
      $("#bt-fog").classList.toggle("on", !Board.showFog);
      Board.draw();
    };
    // party
    $("#btn-create-char").onclick = () => Creator.start();
    // combat
    $("#btn-start-combat").onclick = () => Combat.start();
    $("#btn-end-combat").onclick = () => Combat.end("Ended manually.");
    // story
    $("#autonomy-sel").onchange = e => { S.settings.autonomy = e.target.value; saveSoon(); };
    $("#new-adventure").onclick = () => DM.newAdventure();
    $("#undo-dm").onclick = () => DM.undo();
    $("#chatform").onsubmit = e => { e.preventDefault(); this.sendChat(); };
    $("#chatinput").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); this.sendChat(); }
    });
    // keyboard
    window.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        if (Board.targeting) Board.cancelTargeting();
        Board.measureFrom = null; Board.draw();
        Modal.close();
      }
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      if (e.key === " " && S.combat.active) { e.preventDefault(); Combat.nextTurn(); }
    });
  },
  sendChat() {
    const input = $("#chatinput");
    const text = input.value.trim();
    if (!text || DM.busy) return;
    input.value = "";
    Chat.player(text);
    DM.send(text);
  },
  switchMode(mode) {
    this.mode = mode;
    $$(".mode-tab").forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
    $("#editor-palette").classList.toggle("hidden", mode !== "edit");
    $("#board").classList.toggle("painting", mode === "edit");
    if (mode === "edit") { $("#map-w").value = S.map.w; $("#map-h").value = S.map.h; Editor.renderLibrary(); }
    Board.draw();
  },
  switchTab(tab) {
    $$(".side-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
    $$(".side-panel").forEach(p => p.classList.toggle("active", p.id === "tab-" + tab));
  },
  renderCombat() { Combat.renderPanel(); },
  renderAll() {
    Characters.renderParty();
    Combat.renderPanel();
    Board.draw();
  },
};

document.addEventListener("DOMContentLoaded", () => App.init());
</script>
</body>
</html>
